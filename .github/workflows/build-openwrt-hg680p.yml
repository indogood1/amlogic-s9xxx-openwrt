# =============================================================================
# Build OpenWrt for HG680P (S905X) - Matching good image from FULL_REPORT.txt
#
# KEY FACTS from your good image:
#   Kernel:   5.15.135-ophub
#   DTB:      meson-gxl-s905x-p212.dtb
#   WiFi:     radio0 = brcmfmac (SDIO/MMC, internal)
#             radio1 = rtl8188fu (USB dongle, path 1-2:1.0)
#   Base:     OpenWrt 23.05.0 (armsr/armv8)
#   VPN:      xray-core, openclash, passwall
# =============================================================================

name: Build OpenWrt HG680P S905X

on:
  workflow_dispatch:
    inputs:
      openwrt_kernel:
        description: 'Kernel version (e.g. 5.15.y or 5.15.135)'
        required: false
        default: '5.15.y'
      openwrt_size:
        description: 'Root partition size in MB'
        required: false
        default: '1024'

env:
  # === TARGET DEVICE ===
  OPENWRT_SOC: s905x
  OPENWRT_DTB: meson-gxl-s905x-p212.dtb    # confirmed from uEnv.txt

  # === SOURCE (official OpenWrt 23.05 — matches your good image) ===
  OPENWRT_BRANCH: v23.05.0
  OPENWRT_TARGET: armsr
  OPENWRT_SUBTARGET: armv8

  # === BUILD ===
  CONFIG_FILE: config/hg680p.config
  FEEDS_FILE: config/feeds.conf.default

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 1. Free disk space (Ubuntu runners have ~14GB free, OpenWrt needs ~20GB)
      # -----------------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get purge -y google-chrome-stable firefox azure-cli
          sudo apt-get autoremove -y
          df -h

      # -----------------------------------------------------------------------
      # 2. Install build dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget curl

      # -----------------------------------------------------------------------
      # 3. Clone OpenWrt 23.05.0 (exact version from your good image)
      # -----------------------------------------------------------------------
      - name: Clone OpenWrt source
        run: |
          git clone --depth 1 --branch ${{ env.OPENWRT_BRANCH }} \
            https://github.com/openwrt/openwrt.git
          cd openwrt
          echo "OpenWrt version:"
          git log --oneline -1

      # -----------------------------------------------------------------------
      # 4. Add community feeds for passwall / openclash / xray
      # -----------------------------------------------------------------------
      - name: Add custom feeds
        working-directory: openwrt
        run: |
          # Zerotier is already in OpenWrt official feeds

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # -----------------------------------------------------------------------
      # 5. Apply configuration
      # (If you have a config/hg680p.config file in your repo, it will be used.
      #  Otherwise we generate a minimal config inline below.)
      # -----------------------------------------------------------------------
      - name: Apply build config
        working-directory: openwrt
        run: |
          if [ -f "../${{ env.CONFIG_FILE }}" ]; then
            cp "../${{ env.CONFIG_FILE }}" .config
            echo "Using config file from repo"
          else
            echo "Generating config inline..."
            cat > .config << 'DOTCONFIG'
          # Target: armsr/armv8 (matches your good image DISTRIB_TARGET)
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y

          # Filesystem: btrfs (your image uses btrfs with zstd)
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=1024
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_btrfs-progs=y
          CONFIG_PACKAGE_kmod-lib-zstd=y

          # === WiFi — from your FULL_REPORT ===
          # radio0: brcmfmac (internal SDIO WiFi)
          # NOTE: brcmfmac is NOT in the opkg list because it comes from
          # the ophub kernel, not the OpenWrt rootfs. The rootfs only needs:
          CONFIG_PACKAGE_kmod-cfg80211=y
          CONFIG_PACKAGE_kmod-mac80211=y
          # Atheros (for USB WiFi dongles, ath9k-htc is in your firmware list)
          CONFIG_PACKAGE_kmod-ath=y
          CONFIG_PACKAGE_kmod-ath9k=y
          CONFIG_PACKAGE_kmod-ath9k-common=y
          CONFIG_PACKAGE_kmod-ath9k-htc=y
          CONFIG_PACKAGE_ath9k-htc-firmware=y
          # Realtek (rtl8188fu — your radio1 USB dongle)
          CONFIG_PACKAGE_kmod-rtlwifi=y
          # wpad-basic (from your good image)
          CONFIG_PACKAGE_wpad-basic=y
          CONFIG_PACKAGE_hostapd-common=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_wireless-regdb=y
          CONFIG_PACKAGE_wireless-tools=y

          # === Passwall / Proxy (from your good image) ===
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_dns2tcp=y
          CONFIG_PACKAGE_microsocks=y

          # === LuCI ===
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-theme-material=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_luci-app-amlogic=y
          # Modem support (from your good image)
          CONFIG_PACKAGE_luci-app-modeminfo=y
          CONFIG_PACKAGE_luci-app-sms-tool=y
          CONFIG_PACKAGE_luci-app-3ginfo-lite=y
          CONFIG_PACKAGE_luci-app-diskman=y

          # === USB Networking (from your opkg list) ===
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8150=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-usb-acm=y
          CONFIG_PACKAGE_kmod-usb-wdm=y
          CONFIG_PACKAGE_r8152-firmware=y

          # === Firewall / Network ===
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_kmod-ipt-conntrack=y
          CONFIG_PACKAGE_kmod-ipt-conntrack-extra=y
          CONFIG_PACKAGE_kmod-ipt-iprange=y
          CONFIG_PACKAGE_kmod-ipt-ipset=y
          CONFIG_PACKAGE_kmod-ipt-socket=y
          CONFIG_PACKAGE_kmod-nf-tproxy=y
          CONFIG_PACKAGE_kmod-nf-socket=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-ppp=y
          CONFIG_PACKAGE_kmod-pppoe=y

          # === Filesystems ===
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-ntfs=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fuse=y
          CONFIG_PACKAGE_ntfs-3g=y
          CONFIG_PACKAGE_dosfstools=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_parted=y

          # === Base utils (from your good image) ===
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_tar=y
          CONFIG_PACKAGE_gzip=y
          CONFIG_PACKAGE_bzip2=y
          CONFIG_PACKAGE_xz=y
          CONFIG_PACKAGE_jq=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_openssh-client=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_vnstat2=y
          CONFIG_PACKAGE_zerotier=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_adb=y
          CONFIG_PACKAGE_netdata=y
          CONFIG_PACKAGE_php8=y
          CONFIG_PACKAGE_php8-fpm=y
          CONFIG_PACKAGE_smartmontools=y

          # === Modem tools (from your good image) ===
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_libmbim=y
          CONFIG_PACKAGE_libqmi=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_wwan=y
          CONFIG_PACKAGE_luci-proto-mbim=y
          CONFIG_PACKAGE_luci-proto-ncm=y
          CONFIG_PACKAGE_luci-proto-qmi=y
          CONFIG_PACKAGE_luci-proto-3g=y
          DOTCONFIG
          fi

          make defconfig

      # -----------------------------------------------------------------------
      # 6. Compile OpenWrt rootfs
      # -----------------------------------------------------------------------
      - name: Compile OpenWrt
        working-directory: openwrt
        run: |
          echo "Building with $(nproc) threads..."
          # Try parallel build; fall back to single thread on error
          make -j$(nproc) || make -j1 V=s
          echo "BUILD_DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          ls -lh bin/targets/${{ env.OPENWRT_TARGET }}/${{ env.OPENWRT_SUBTARGET }}/

      # -----------------------------------------------------------------------
      # 7. Package rootfs into S905X image using ophub's tool
      # -----------------------------------------------------------------------
      - name: Package for HG680P S905X
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/${{ env.OPENWRT_TARGET }}/${{ env.OPENWRT_SUBTARGET }}/*rootfs.tar.gz
          openwrt_soc: s905x
          openwrt_kernel: ${{ github.event.inputs.openwrt_kernel || '5.15.y' }}
          auto_kernel: true
          openwrt_size: ${{ github.event.inputs.openwrt_size || '1024' }}
          # Force the exact DTB that works on your HG680P
          # (ophub selects meson-gxl-s905x-p212.dtb for s905x by default)

      # -----------------------------------------------------------------------
      # 8. Upload to GitHub Release
      # -----------------------------------------------------------------------
      - name: Upload firmware to Release
        uses: ncipollo/release-action@v1
        with:
          tag: openwrt_hg680p_${{ env.PACKAGED_OUTPUTDATE }}
          name: OpenWrt HG680P S905X ${{ env.PACKAGED_OUTPUTDATE }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## OpenWrt for HG680P (S905X)

            - **Base**: OpenWrt ${{ env.OPENWRT_BRANCH }} (armsr/armv8)
            - **Kernel**: ${{ github.event.inputs.openwrt_kernel || '5.15.y' }}
            - **DTB**: meson-gxl-s905x-p212.dtb
            - **Built**: ${{ env.BUILD_DATE }}

            ### What's included (matching your good image)
            # - OpenClash (${{ env.LUCI_APP_OPENCLASH || 'latest' }}) + Xray core
            - PassWall
            - ZeroTier
            - brcmfmac WiFi (internal SDIO) + rtl8188fu (USB dongle)
            - Full modem support (QMI, MBIM, NCM, PPPoE)
            - Disk manager, netdata, ttyd

            ### Boot instructions (HG680P)
            1. Flash to USB/SD with balenaEtcher
            2. Insert USB → press reset button in AV port while powering on
            3. Hold ~5s until LED blinks → boots OpenWrt
            4. Login: 192.168.1.1 / root / password

            > ⚠️ HG680P S905X = USB/SD boot only (no eMMC install)
